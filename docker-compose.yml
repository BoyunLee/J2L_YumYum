services:
  mysql:
    image: mysql:8.4
    container_name: yumyum-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: yumyum
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/00-init-yumyum.sh:/docker-entrypoint-initdb.d/00-init-yumyum.sh:ro
      - ./BackEnd/src/main/resources/sql/yumyum.sql:/docker-entrypoint-sql/01-yumyum.sql:ro
      - ./BackEnd/src/main/resources/sql/SSAFY_COACH_Dump.sql:/docker-entrypoint-sql/02-food-nutrition-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ussafy -pssafy --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pororo-ocr:
    build:
      context: ./OcrService
      dockerfile: Dockerfile
    container_name: yumyum-pororo-ocr
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - pororo_cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: yumyum-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      pororo-ocr:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: yumyum-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
  pororo_cache:
