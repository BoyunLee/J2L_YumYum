services:
  mysql:
    image: mysql:8.4
    container_name: yumyum-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yumyum}
      MYSQL_USER: ${MYSQL_USER:-ssafy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ssafy}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BackEnd/src/main/resources/sql/yumyum.sql:/docker-entrypoint-initdb.d/01-yumyum.sql:ro
      - ./BackEnd/src/main/resources/sql/SSAFY_COACH_Dump.sql:/docker-entrypoint-initdb.d/02-food-nutrition-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pororo-ocr:
    build:
      context: ./OcrService
      dockerfile: Dockerfile
    container_name: yumyum-pororo-ocr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PORORO_OCR_LANG: ${PORORO_OCR_LANG:-ko}
    ports:
      - "${PORORO_OCR_PORT:-8001}:8000"
    volumes:
      - pororo_cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: yumyum-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      pororo-ocr:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: yumyum-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  mysql_data:
  pororo_cache:
