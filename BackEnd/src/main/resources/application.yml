spring:
  application:
    name: yumyum
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  datasource:
    hikari:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: "${SPRING_DATASOURCE_HIKARI_JDBC_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:yumyum}?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false}"
      username: ${MYSQL_USER:ssafy}
      password: ${MYSQL_PASSWORD:ssafy}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:3}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      auto-commit: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: ${GOOGLE_SCOPE:email,profile}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: ${NAVER_REDIRECT_URI:{baseUrl}/login/oauth2/code/naver}
            scope: ${NAVER_SCOPE:name,email,profile_image}
            client-name: Naver
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/kakao}
            scope: ${KAKAO_SCOPE:profile_nickname,account_email}
            client-name: Kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${BACKEND_INTERNAL_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

mybatis:
  type-aliases-package: com.ssafy.yumyum.domain
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

company:
  origin-url: ${COMPANY_ORIGIN_URL:http://localhost:5173}
  temp-url: ${COMPANY_TEMP_URL:http://localhost}
  temp-url-port: ${COMPANY_TEMP_URL_PORT:http://localhost:8080}
  logo-url: ${COMPANY_LOGO_URL:http://localhost:8080}

jwt:
  issuer: ${JWT_ISSUER:J2L_yumyum}
  secret-key: ${JWT_SECRET_KEY:local-demo-secret-change-me-32-bytes-minimum}
  access-expired-at: ${JWT_ACCESS_EXPIRED_AT:3600000}
  refresh-expired-at: ${JWT_REFRESH_EXPIRED_AT:604800000}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    role: ${ADMIN_BOOTSTRAP_ROLE:SUPER_ADMIN}

integration:
  mode: ${INTEGRATION_MODE:mock}

gms:
  api:
    url: ${GMS_API_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}
    model: ${GMS_API_MODEL:gpt-5-nano}
    key: ${GMS_API_KEY:${GMS_KEY:}}

pororo:
  ocr:
    url: ${PORORO_OCR_URL:http://localhost:8001/ocr}
    lang: ${PORORO_OCR_LANG:ko}

ocr:
  image-compression:
    max-bytes: ${OCR_IMAGE_COMPRESSION_MAX_BYTES:3145728}
    max-width: ${OCR_IMAGE_COMPRESSION_MAX_WIDTH:1600}
    max-height: ${OCR_IMAGE_COMPRESSION_MAX_HEIGHT:1600}
    jpeg-quality: ${OCR_IMAGE_COMPRESSION_JPEG_QUALITY:0.8}
    min-jpeg-quality: ${OCR_IMAGE_COMPRESSION_MIN_JPEG_QUALITY:0.5}

food-safety:
  api:
    base-url: ${FOOD_SAFETY_API_BASE_URL:http://openapi.foodsafetykorea.go.kr/api}
    key: ${FOOD_SAFETY_API_KEY:}

notification:
  expiration:
    cron: ${NOTIFICATION_EXPIRATION_CRON:0 0 7 * * *}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ssafy.yumyum: ${LOG_LEVEL_APP:INFO}
